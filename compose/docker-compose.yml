services:
  proxy:
    image: nginx:1.27-alpine
    container_name: proxy
    ports:
      - "80:80"
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-net
    depends_on:
      - app
    restart: unless-stopped

  app:
    image: nginx:1.27-alpine
    container_name: app
    volumes:
      - ./app/index.html:/usr/share/nginx/html/index.html:ro
    networks:
      - app-net
    restart: unless-stopped

networks:
  app-net:
    driver: bridge
